# Inventario PYME: MongoDB (con replica set para las transacciones), backend y frontend.
#
#   1. Copia .env.example a .env y completa JWT_SECRET (y el administrador inicial).
#   2. docker compose up -d --build
#   3. Abre http://localhost:8080
#
# Los datos de MongoDB viven en el volumen "mongo-data" y sobreviven a reinicios y actualizaciones.

services:
  mongo:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Se inicializa el replica set la primera vez y se considera "sano" cuando el nodo es PRIMARY.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(rs.status().myState === 1 ? 0 : 1) } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}); quit(1) }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s
    restart: unless-stopped
    # Para conectarte desde tu equipo (por ejemplo con MongoDB Compass), descomenta:
    # ports:
    #   - "127.0.0.1:27017:27017"

  backend:
    build: ./backend
    environment:
      PORT: "3000"
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/inventario_pedidos?replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en el archivo .env (copia .env.example a .env)}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
      ZONA_OFFSET_HORAS: ${ZONA_OFFSET_HORAS:--5}
      # Administrador inicial: se crea una sola vez, si no existe.
      ADMIN_NOMBRE: ${ADMIN_NOMBRE:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mongo-data:
