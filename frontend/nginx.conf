server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Canal de cambios en tiempo real (Server-Sent Events): sin búfer y con conexiones largas.
  location /api/eventos {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
  }

  # API REST
  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 5m;
  }

  # Archivos con hash en el nombre: se pueden guardar un año en el navegador.
  location ~* \.(?:js|css|woff2?|ico|svg|png|jpg|jpeg|webp)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # El index nunca se guarda, para que las actualizaciones se vean al recargar.
  location = /index.html {
    add_header Cache-Control "no-store";
  }

  # Rutas de Angular (/dashboard, /pedidos/123…): siempre devuelven index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
