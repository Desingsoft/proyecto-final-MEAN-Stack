<div class="form-container">
  <h1>{{ esEdicion() ? 'Editar proveedor' : 'Nuevo proveedor' }}</h1>

  <form [formGroup]="proveedorForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>Nombre</label>
      <input type="text" formControlName="nombre">
    </div>
    <div class="form-group">
      <label>Persona de contacto</label>
      <input type="text" formControlName="contacto">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Teléfono</label>
        <input type="text" formControlName="telefono">
      </div>
      <div class="form-group">
        <label>Email</label>
        <input type="email" formControlName="email">
      </div>
    </div>

    <div class="form-group">
      <label>Días de crédito que te da</label>
      <input type="number" min="0" formControlName="diasCredito">
      <span class="ayuda">Plazo para pagarle: se usa para calcular cuándo vencen tus cuentas por pagar.</span>
    </div>

    @if (errorMsg()) {
      <div class="error-alert">{{ errorMsg() }}</div>
    }

    <div class="form-actions">
      <button type="button" (click)="router.navigate(['/proveedores'])">Cancelar</button>
      <button type="submit" [disabled]="proveedorForm.invalid || cargando()">
        {{ cargando() ? 'Guardando...' : 'Guardar' }}
      </button>
    </div>
  </form>
</div>
